# Project settings. Every number in the write-up should be reproducible from this file.

sec_identity: "Your Name your.email@example.com"   # SEC EDGAR requires a name and email

# Where the work runs (decided 2026-11-24): the laptop does every step that needs no GPU,
# Google Colab does every step that does, and files move between them through GitHub (code)
# and Google Drive (data, checkpoints, run outputs). The school GPU is the fallback.
machines:
  laptop:
    os: Windows 11          # no NVIDIA GPU. Smart App Control is on: it blocks unsigned programs,
                            # so uv's own Python builds won't run here
    python: "3.14.0"        # the signed python.org install, used for .venv (built 2026-11-24).
                            # 3.15 also fails here: ranx's lz4 and fastparquet have no Windows
                            # builds for 3.15 yet (checked 2026-11-24)
    torch_build: cpu        # a plain install gets this, and it's what a laptop without a GPU needs
  colab:
    plan: Google AI Pro     # includes about 200 Colab compute units a month (Google's plans page,
                            # Nov 2026). Check the balance under Runtime > View resources
    unit_budget: 200        # the whole project is estimated at about 100 units; record units per step
    gpus:                   # chosen under Runtime > Change runtime type; record the GPU for every run.
                            # Rates are third-party measurements from March 2026, not Google's
      l4:   {memory_gb: 24, units_per_hour: 1.7}   # bf16; about the school GPU's speed
      a100: {memory_gb: 40, units_per_hour: 5.4}   # about 4-5x faster; the 80 GB version is about 7.5/hour.
                                                   # Not always available
      t4:   {memory_gb: 16, units_per_hour: 1.2}   # free tier: no bf16, and NV-Embed-v2 doesn't fit.
                                                   # Quick tests only
    python: null            # Colab's own version: record it (python --version) in every session
    background_execution: false   # not included in Google AI Pro: keep the tab open during a run
    drive_folder: /content/drive/MyDrive/stair   # the same folder the Drive desktop app syncs on the laptop
  school_gpu:               # fallback only (recorded 2026-11-17)
    gpu: NVIDIA RTX 4000 SFF Ada Generation   # 20 GB VRAM, 70 W, supports bf16
    driver: "596.71"
    os: Windows             # school computer: no Linux/WSL and no admin rights, so no vLLM
    python: "3.15.2"
    torch_build: cu130      # PyTorch's CUDA 13.0 build (torch 2.14.1); no CUDA toolkit install needed

sector: Technology
companies: [NVDA, AVGO, GOOGL, META, CRM, ADBE, AAPL, DELL, CRWV, FIG]
# Training companies, in pairs: chips (NVDA, AVGO), internet (GOOGL, META),
# software (CRM, ADBE), hardware (AAPL, DELL).
heldout_companies: [CRWV, FIG]
# Both listed in 2025, and their only 10-K is FY2025 (checked on EDGAR 2026-11-17).
# They were chosen for that reason before any results existed, so the held-out
# test measures first-time filers the model has never seen.
test_only_companies: [ORCL, AMD]
# Established companies, never trained on, tested on their FY2025 10-K only (added 2026-11-23,
# checked on EDGAR: ORCL FY ending 2025-05-31, AMD FY ending 2025-12-27). One software, one chips.
# They separate "a company the model never saw" from "a company's first 10-K" (CRWV, FIG).
fiscal_years: [2024, 2025]
# Each company's own fiscal years, so "FY2025" ends anywhere from Jan 2025 (NVDA, CRM, DELL)
# to Dec 2025 (GOOGL, META, CRWV, FIG). Held-out and test-only companies use FY2025 only.

models:
  stair_base: mistralai/Mistral-7B-Instruct-v0.2   # Apache 2.0; not gated on Hugging Face (checked 2026-11-23)
  question_writer: Qwen/Qwen2.5-14B-Instruct       # load in 4-bit with bitsandbytes, about 10 GB. Mixtral 8x7B (the paper's choice)
                                                   # needs about 25 GB even in 4-bit: too much for an L4, and Colab
                                                   # doesn't always offer an A100
  embedding: nvidia/NV-Embed-v2                     # about 16 GB in fp16: fits on an L4 or A100 for inference, not on a T4;
                                                   # BAAI/bge-large-en-v1.5 if memory is tight
  reranker: BAAI/bge-reranker-v2-m3                 # cross-encoder, about 570M parameters (about 1 GB), Apache 2.0

# Where each piece runs (decided 2026-11-19, moved to Colab 2026-11-24).
#   laptop = the laptop's CPU, in .venv
#   colab  = a Colab GPU (L4, or A100 for training when offered), through transformers
#   hf_api = Hugging Face Inference Providers (hosted). The token comes from the HF_TOKEN
#            environment variable, never from this file.
runs_on:
  download_and_parse: laptop
  handwritten_labels: laptop   # labelling, and judging the pooled sections for hand-written questions
  question_writer: colab       # Qwen2.5-14B in 4-bit; also the judge (steps 1.8, 3.6, 5.6)
  stair_training: colab        # hosted APIs can't run the official training code
  stair_inference: colab       # the title trie and top-3 beam search need local generation
  bm25: laptop                 # no model; CPU is enough
  embeddings: colab
  hybrid: laptop               # only merges the BM25 and embedding rankings
  reranker: colab              # run after NV-Embed-v2 is unloaded, not alongside it
  untuned_mistral_toc: colab   # same model and GPU type as STAIR, so the comparison is fair
  stronger_llm_toc: hf_api     # 70B-class models don't fit on an L4
  whole_filing_llm: hf_api     # needs 50k-100k tokens of context
  objective5_answers: colab    # the answering model and the cited-answer judge
  scoring: laptop              # metrics, bootstrap CIs, Holm, tables and figures

hf_api:
  provider: null               # choose one; check its context limit and price per token for the model
  stronger_llm: null           # a 70B-class instruct model
  whole_filing_llm: null       # its context limit at this provider must exceed the longest filing
  temperature: 0
  cache_dir: data/api_cache    # every response is saved here so reruns don't pay twice (gitignored)
  # Record provider, model and run date in the write-up; providers may serve compressed models.
  # Also record each model's training-data cutoff (steps 3.4-3.5): filings published before it
  # may have been seen in training. Use API outputs as baselines or judges, never as STAIR
  # training data unless the model's licence allows it.

questions:
  per_paragraph: 3
  paragraph_words: [100, 300]
  near_duplicate_cosine: 0.9
  split: {train: 0.8, dev: 0.1, test: 0.1}   # split by paragraph, not by question

ambiguity:                # step 1.8: other sections that also answer a generated question
  candidates: 3           # top other sections from BM25 + embeddings, checked by the judge
  chunk_words: 300        # the judge sees the best-matching chunk of each candidate
  judge: Qwen/Qwen2.5-14B-Instruct   # the question writer, not one of the compared methods
  train_sample: 0.1       # share of training questions checked first
  train_threshold: 0.15   # if more than this share is ambiguous, check all and drop flagged ones
  hand_checks: 50         # judge decisions checked by hand

scoring:
  headline: hit           # R@k = any answers_alone section in the top k (official match@k)
  ks: [1, 3]
  needed_together: all_at_3
  bootstrap_unit: template   # hand-written set: resample templates, not questions
  bootstrap_unit_synthetic: section   # synthetic and held-out sets: resample sections
  bootstrap_samples: 10000
  primary:                   # chosen before any test run (step 3.7); the headline claim
    method_a: stair_official
    method_b: hybrid_reranker
    metric: R@1
    test_set: handwritten
  multiple_comparisons: holm # every other STAIR comparison is secondary, Holm-adjusted
  alpha: 0.05
  min_cell_count: 30         # below this, show the count and CI and draw no conclusion

objective5:
  context_sections: 3        # the answering LLM reads each retriever's top 3 sections
  compare_with: hybrid_reranker
  answer_model: Qwen/Qwen2.5-14B-Instruct   # not one of the compared methods
  answer_check_questions: 50 # step 5.6: correct, supported, valid citation
  answer_check_by_hand: 20   # judge decisions checked by hand

lora:                     # rank and alpha follow the paper
  r: 16
  alpha: 32
  dropout: 0.05
  load_in_4bit: true      # on every GPU, A100 included, so runs match whichever GPU Colab assigns

training:
  max_epochs: 10          # set from the step 2.5 estimate, so that a run fits the budget below
  early_stopping_patience: 3
  dev_sample: 300
  per_device_batch_size: 1          # one long ToC prompt at a time on an L4 (24 GB)
  gradient_accumulation_steps: 16   # effective batch size 16
  gradient_checkpointing: true
  bf16: true
  max_hours_per_run: 8              # budget for one full run (step 2.5). If over, cut in this order:
                                    # questions per section, two-level ToC, epochs, smaller model
  max_questions_per_section: null   # set (e.g. 20) only if a run is over budget
  checkpoint_every_minutes: 30      # turned into save_interval steps after the 200-step timing;
                                    # eval_interval must equal it or divide it
  save_total_limit: 3               # the trainer also keeps the best checkpoint
  resume: true                      # after an interruption, continue from the latest checkpoint
  # Write runs to Google Drive (MyDrive/stair/checkpoints/), never to /content, which Colab wipes.

retrieval:
  top_k: 3
  rrf_k: 60                    # hybrid (step 3.3a): each method adds 1 / (60 + rank)
  rerank_depth: 20             # the reranker reorders the hybrid's top 20 (step 3.3b)
  rerank_chunk_words: 300      # same chunks as the embedding retriever, each starting with its section title
  rerank_max_length: 512       # tokens per question-chunk pair
  num_beams: 5                 # restricted version: its top 3 = the 3 best of these beams
  restricted_target: '["{section_num} {title}"]'   # the trie covers this whole string, the format the model
                                                    # is trained to output; not bare titles

seed: 42
