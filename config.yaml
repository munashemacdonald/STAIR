# Project settings. Every number in the write-up should be reproducible from this file.
# Personal details and secrets never go here: the SEC identity and the Hugging Face token are read
# from the SEC_IDENTITY and HF_TOKEN environment variables.

# Where the work runs (decided 2026-11-24): the laptop does every step that needs no GPU,
# Google Colab does every step that does, and files move between them through GitHub (code)
# and Google Drive (data, checkpoints, run outputs). The school GPU is the fallback.
machines:
  laptop:
    os: Windows 11          # no NVIDIA GPU. Smart App Control is on: it blocks unsigned programs,
                            # so uv's own Python builds won't run here
    python: "3.14.0"        # the signed python.org install, used for .venv (built 2026-11-24).
                            # 3.15 also fails here: ranx's lz4 and fastparquet have no Windows
                            # builds for 3.15 yet (checked 2026-11-24)
    torch_build: cpu        # a plain install gets this, and it's what a laptop without a GPU needs
  colab:
    plan: Google AI Pro     # includes about 200 Colab compute units a month (Google's plans page,
                            # Nov 2026). Check the balance under Runtime > View resources
    unit_budget: 200        # the whole project is estimated at about 100 units; record units per step
    gpus:                   # chosen under Runtime > Change runtime type; record the GPU for every run.
                            # Rates are third-party measurements from March 2026, not Google's
      l4:   {memory_gb: 24, units_per_hour: 1.7}   # bf16; about the school GPU's speed
      a100: {memory_gb: 40, units_per_hour: 5.4}   # about 4-5x faster; the 80 GB version is about 7.5/hour.
                                                   # Not always available
      t4:   {memory_gb: 16, units_per_hour: 1.2}   # free tier: no bf16, and NV-Embed-v2 doesn't fit.
                                                   # Quick tests only
    python: null            # Colab's own version: record it (python --version) in every session
    background_execution: false   # not included in Google AI Pro: keep the tab open during a run
    drive_folder: /content/drive/MyDrive/stair   # the same folder the Drive desktop app syncs on the laptop
  school_gpu:               # fallback only (recorded 2026-11-17)
    gpu: NVIDIA RTX 4000 SFF Ada Generation   # 20 GB VRAM, 70 W, supports bf16
    driver: "596.71"
    os: Windows             # school computer: no Linux/WSL and no admin rights, so no vLLM
    python: "3.15.2"
    torch_build: cu130      # PyTorch's CUDA 13.0 build (torch 2.14.1); no CUDA toolkit install needed

sector: Technology
companies: [NVDA, AVGO, GOOGL, META, CRM, ADBE, AAPL, DELL, CRWV, FIG]
# Training companies, in pairs: chips (NVDA, AVGO), internet (GOOGL, META),
# software (CRM, ADBE), hardware (AAPL, DELL).
heldout_companies: [CRWV, FIG]
# Both listed in 2025, and their only 10-K is FY2025 (checked on EDGAR 2026-11-17).
# They were chosen for that reason before any results existed, so the held-out
# test measures first-time filers the model has never seen.
test_only_companies: [ORCL, AMD]
# Established companies, never trained on, tested on their FY2025 10-K only (added 2026-11-23,
# checked on EDGAR: ORCL FY ending 2025-05-31, AMD FY ending 2025-12-27). One software, one chips.
# They separate "a company the model never saw" from "a company's first 10-K" (CRWV, FIG).
fiscal_years: [2024, 2025]
# Each company's own fiscal years, so "FY2025" ends anywhere from Jan 2025 (NVDA, CRM, DELL)
# to Dec 2025 (GOOGL, META, CRWV, FIG). Held-out and test-only companies use FY2025 only.
train_fy: 2024            # STAIR trains on the 8 training companies' FY2024 filings only (decided 2026-11-25,
                          # from the review). No FY2025 filing is ever trained on.
test_fy: 2025             # every test set, the hand-written headline included, uses FY2025 filings
test_groups:              # the `group` field on every FY2025 test question
  seen_company: [NVDA, AVGO, GOOGL, META, CRM, ADBE, AAPL, DELL]   # trained on their FY2024 filing
  first_time: [CRWV, FIG]
  established: [ORCL, AMD]
# Two zero-shot levels (2026-11-25), answering the paper's Section 7 question:
#   temporal zero-shot       = seen_company: a new filing from a company seen in training
#   cross-company zero-shot  = first_time + established: a new company and a new filing

prompt:                   # decided 2026-11-25, before any training
  header: "SEC Form 10-K filing"   # replaces the official code's "Book: {title}"; no company name or year,
                                   # so the model can't key what it learns on a company's name
  company_in_questions: "the company"   # no question names the company, for every method. The table of
                                        # contents can still reveal the company; say so in the write-up

models:
  stair_base: mistralai/Mistral-7B-Instruct-v0.2   # Apache 2.0; not gated on Hugging Face (checked 2026-11-23)
  question_writer: Qwen/Qwen2.5-14B-Instruct       # Apache 2.0. Mixtral 8x7B (the paper's choice) needs about 25 GB even in
                                                   # 4-bit: too much for an L4, and Colab doesn't always offer an A100
  question_writer_vllm: Qwen/Qwen2.5-14B-Instruct-AWQ   # the same model, 4-bit (AWQ), Apache 2.0 (checked 2026-11-25).
                                                   # Served with vLLM on Colab for question writing, the judges and
                                                   # objective 5's answers; much faster than transformers in 4-bit
  embedding: nvidia/NV-Embed-v2                     # about 16 GB in fp16: fits on an L4 or A100 for inference, not on a T4;
                                                   # BAAI/bge-large-en-v1.5 if memory is tight
  reranker: BAAI/bge-reranker-v2-m3                 # cross-encoder, about 570M parameters (about 1 GB), Apache 2.0

# Where each piece runs (decided 2026-11-19, moved to Colab 2026-11-24, simplified 2026-11-25).
#   laptop = the laptop's CPU, in .venv
#   colab  = a Colab GPU (L4, or A100 for training when offered)
# No paid API is used: the stronger-LLM and whole-10-K baselines were cut on 2026-11-25.
runs_on:
  download_and_parse: laptop
  handwritten_labels: laptop   # labelling, and checking a sample of the judge's pooled decisions
  question_writer: colab       # Qwen2.5-14B (AWQ) with vLLM; also the pooling judge and objective 5's answers
  stair_training: colab        # the official training code
  stair_inference: colab       # 5-beam search with transformers
  bm25: laptop                 # no model; CPU is enough
  embeddings: colab
  hybrid: laptop               # only merges the BM25 and embedding rankings
  reranker: colab              # run after NV-Embed-v2 is unloaded, not alongside it
  untuned_mistral_toc: colab   # same model, prompt, decoding and GPU type as STAIR, so the comparison is fair
  objective5_answers: colab
  scoring: laptop              # metrics, bootstrap CIs, Holm, tables and figures

questions:                # generated per section, not per paragraph (decided 2026-11-25, from the review)
  passage_words: [100, 300] # each question is written from one passage of the section
  train_per_section:        # FY2024 filings of the 8 training companies
    base: 3                 # every leaf section gets 3 questions
    extra_per_words: 500    # plus 1 for every 500 words beyond the first 500, with passages spread across it
    max: 6
  target_train_questions: 5000   # about this many; adjust base or max if the count is far off
  test_per_section: 2       # FY2025 filings: dev, test_synthetic and test_heldout
  near_duplicate_cosine: 0.9
  handwritten_overlap_cosine: 0.85   # drop generated questions this close to a hand-written one
  answerability_check: true # the question writer confirms each question is answered by its passage
  hand_read: 100            # random generated questions read by hand; regenerate if under ~80% are good
  dev_share: 0.2            # FY2025, 8 training companies: 20% of sections go to dev, 80% to test_synthetic,
                            # split by section so no section is in both

handwritten:              # the headline test set (step 1.9), cut to about 200 questions on 2026-11-25
  financebench_templates: [dg09, dg11, dg14, dg19, dg20, dg22, dg24]
  # Chosen before any table of contents was parsed. dg09, dg11, dg20 and dg22 feed objective 5;
  # dg14 (operating margin), dg19 (cash flows) and dg24 (working capital) keep financial-statement
  # questions in the set and apply to every tech company. The rest duplicate these (quick ratio,
  # gross-margin variants), need the cover page (dg04) or fit few tech companies (dg25 inventory).
  checklist_templates: [ck01, ck02, ck03, ck04, ck05, ck06, ck07, ck08]
  company_specific:         # 36 in all, weighted toward the unseen companies (2026-11-25)
    seen_company: 2         # 8 companies x 2 = 16
    unseen: 5               # 4 companies (first_time + established) x 5 = 20
  # 15 templates x 12 companies + 36 company-specific = up to 216 questions, before skips.
  # Independent units: seen group about 31 (15 templates + 16), unseen group about 35 (15 + 20)
  second_labeller_questions: 30

pooling:                  # step 3.7: each method's top 3, judged blind after every method has run. This is
                          # how other correct sections get found, for every method equally
  judge: Qwen/Qwen2.5-14B-Instruct   # judges the generated and the hand-written questions; the judge sees the
  chunk_words: 300                   # best-matching chunk of each pooled section
  hand_checks_handwritten: 50        # random pooled decisions on hand-written questions, checked by hand, blind

scoring:
  headline: hit           # R@k = any answers_alone section in the top k (official match@k)
  ks: [1, 3]
  needed_together: all_at_3
  bootstrap_unit: template   # hand-written set: resample templates, not questions
  bootstrap_unit_synthetic: section   # synthetic and held-out sets: resample sections
  bootstrap_samples: 10000
  primary:                   # two co-primary comparisons, fixed 2026-11-25 before any test run (step 3.8)
    method_a: stair          # the one STAIR version: 5-beam search, its top beam for R@1
    method_b: hybrid_reranker
    metric: R@1
    comparisons:
      temporal_zero_shot: {test_set: handwritten, groups: [seen_company]}
      cross_company_zero_shot: {test_set: handwritten, groups: [first_time, established]}
    correction: holm         # across the two co-primaries
  tested_secondary:          # given full significance tests, Holm-adjusted with the other secondaries
    cross_company_synthetic: {test_set: test_heldout, unit: section}   # power for cross-company zero-shot;
                                                                       # covers only CRWV, FIG, ORCL and AMD
  descriptive: [handwritten_all_12]   # the all-company hand-written R@1, reported without a test
  multiple_comparisons: holm # every other STAIR comparison is secondary, Holm-adjusted
  alpha: 0.05
  min_cell_count: 30         # below this, show the count and CI and draw no conclusion

objective5:
  context_sections: 3        # the answering LLM reads each retriever's top 3 sections
  checklist: [ck01, ck02, ck03, ck04, ck05, ck06, ck07, ck08, dg09, dg11, dg20, dg22]
  answer_model: Qwen/Qwen2.5-14B-Instruct   # not one of the compared methods
  section_token_cap: 3000    # per section. A longer section is cut to its best chunks by the reranker
                             # (step 5.2); prompt lengths are recorded
  hand_checks: 20            # (company, question) pairs checked by hand: score, section, quote, citation

lora:                     # rank and alpha follow the paper
  r: 16
  alpha: 32
  dropout: 0.05
  load_in_4bit: true      # on every GPU, A100 included, so runs match whichever GPU Colab assigns

training:
  max_epochs: 5           # capped 2026-11-25. The paper (v1) allowed 200 to memorise each book; the official
                          # code defaults to 3. More epochs would memorise FY2024 and hurt unseen filings
  early_stopping_patience: 3        # on FY2025 dev loss; only a signal to stop early
  checkpoint_selection: dev_r1      # mandatory: R@1 on the dev sample, with the test decoding (5 beams), for
                                    # every saved checkpoint. Dev holds seen companies only, so this tunes for
                                    # temporal zero-shot
  dev_sample: 300
  per_device_batch_size: 1          # one long ToC prompt at a time on an L4 (24 GB)
  gradient_accumulation_steps: 16   # effective batch size 16
  gradient_checkpointing: true
  bf16: true
  max_hours_per_run: 8              # budget for one full run (step 2.4). Questions are already capped per
                                    # section (questions.train_per_section). If still over, cut in this order:
                                    # two-level ToC, epochs, smaller model
  targets: single_section           # every training target is a one-item list
  checkpoint_every_minutes: 30      # turned into save_interval steps after the 200-step timing;
                                    # eval_interval must equal it or divide it
  save_total_limit: null            # keep every checkpoint, so each can be scored on dev R@1 after training
                                    # (5 epochs: roughly 10-16 checkpoints, a few GB on Drive)
  resume: true                      # after an interruption, continue from the latest checkpoint
  # Write runs to Google Drive (MyDrive/stair/checkpoints/), never to /content, which Colab wipes.

retrieval:
  top_k: 3
  rrf_k: 60                    # hybrid (step 3.4): each method adds 1 / (60 + rank)
  rerank_depth: 20             # the reranker reorders the hybrid's top 20 (step 3.5)
  chunk_words: 300             # BM25, embeddings and the reranker all use these chunks, each starting with
  chunk_overlap_words: 50      # its section number and title. A section scores as its best chunk (MaxP)
  rerank_max_length: 512       # tokens per question-chunk pair
  stair_decoding:              # one STAIR version (2026-11-25): beam search, no constraint
    num_beams: 5
    top_k: 3                   # top 3 = the valid sections from the beams, in beam order, without repeats;
                               # R@1 = the top beam. Invalid titles are counted, as the paper's hallucinations

seed: 42
